<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Patente B</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }

    header {
      background: #16213e;
      padding: 1rem 2rem;
      text-align: center;
      font-size: 1.4rem;
      font-weight: bold;
      border-bottom: 2px solid #f5a623;
    }
    header span { color: #f5a623; }

    /* SCHERMATE */
    .screen { display: none; max-width: 700px; margin: 2rem auto; padding: 1rem; }
    .screen.active { display: block; }

    /* HOME */
    .home-title { text-align: center; font-size: 1.8rem; margin-bottom: .5rem; }
    .home-sub { text-align: center; color: #aaa; margin-bottom: 2rem; }

    .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; }
    .card {
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 10px;
      padding: 1.5rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s;
    }
    .card:hover { border-color: #f5a623; }
    .card .icon { font-size: 2rem; margin-bottom: .5rem; }
    .card h3 { font-size: 1rem; margin-bottom: .3rem; }
    .card p { font-size: .8rem; color: #aaa; }

    /* QUIZ */
    .quiz-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: .5rem;
    }
    .counter { font-size: .9rem; color: #aaa; }
    .timer { background: #16213e; padding: .4rem 1rem; border-radius: 20px; font-weight: bold; }
    .timer.red { color: #ef4444; border: 1px solid #ef4444; }

    /* barra progresso */
    .progress { height: 6px; background: #0f3460; border-radius: 3px; margin-bottom: 1.5rem; }
    .progress-bar { height: 100%; background: #f5a623; border-radius: 3px; transition: width .3s; }

    .domanda {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 10px;
      padding: 1.5rem;
      margin-bottom: 1rem;
      font-size: 1rem;
      line-height: 1.6;
    }

    .risposte { display: flex; flex-direction: column; gap: .6rem; margin-bottom: 1rem; }
    .risposta {
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 8px;
      padding: .8rem 1rem;
      cursor: pointer;
      color: #eee;
      font-size: .95rem;
      text-align: left;
      transition: border-color .15s;
    }
    .risposta:hover:not(:disabled) { border-color: #f5a623; }
    .risposta.corretta { border-color: #22c55e; background: rgba(34,197,94,.1); }
    .risposta.sbagliata { border-color: #ef4444; background: rgba(239,68,68,.1); }

    .spiegazione {
      display: none;
      background: #0f3460;
      border-radius: 8px;
      padding: 1rem;
      font-size: .88rem;
      line-height: 1.6;
      margin-bottom: 1rem;
    }
    .spiegazione.show { display: block; }

    /* ERRORI */
    .errori { display: flex; gap: .4rem; align-items: center; }
    .pallino {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #0f3460;
      transition: background .3s;
    }
    .pallino.pieno { background: #ef4444; }

    /* RISULTATI */
    .risultato-centro { text-align: center; margin-bottom: 2rem; }
    .grande-emoji { font-size: 4rem; display: block; margin-bottom: .5rem; }
    .punteggio { font-size: 3rem; font-weight: bold; margin: .5rem 0; }
    .punteggio.pass { color: #22c55e; }
    .punteggio.fail { color: #ef4444; }

    .griglia-stat {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
    }
    .stat .num { font-size: 1.8rem; font-weight: bold; }
    .stat .etichetta { font-size: .75rem; color: #aaa; margin-top: .2rem; }

    /* RIEPILOGO */
    .riepilogo-item {
      background: #16213e;
      border-left: 3px solid #0f3460;
      border-radius: 6px;
      padding: .8rem 1rem;
      margin-bottom: .5rem;
      font-size: .85rem;
    }
    .riepilogo-item.ok { border-left-color: #22c55e; }
    .riepilogo-item.no { border-left-color: #ef4444; }
    .riepilogo-label { font-size: .72rem; font-weight: bold; margin-bottom: .3rem; }
    .riepilogo-label.ok { color: #22c55e; }
    .riepilogo-label.no { color: #ef4444; }
    .corretta-txt { color: #22c55e; font-size: .82rem; }

    /* PULSANTI */
    .btn {
      padding: .7rem 1.6rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: .95rem;
      font-weight: bold;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn-arancio { background: #f5a623; color: #111; }
    .btn-grigio { background: #16213e; color: #eee; border: 1px solid #0f3460; }
    .pulsanti { display: flex; gap: .8rem; justify-content: flex-end; margin-top: 1rem; flex-wrap: wrap; }
  </style>
</head>
<body>

<header>🚗 Quiz <span>Patente B</span></header>

<!-- HOME -->
<div class="screen active" id="home">

  <p class="home-sub">Scegli come vuoi allenarti</p>
  <div class="card-grid">

<!-- QUIZ -->
<div class="screen" id="quiz">

  <div class="pulsanti">

</div>

// ══════════════════════════════════════════════
//  VARIABILI DI STATO
// ══════════════════════════════════════════════
let domandeCorrenti = [];
let indice = 0;
let errori = 0;
let risposte = [];
let timerID = null;
let secondiRimasti = 0;
let inizioTempo = 0;
let modalitaCorrente = 'esame';

// ══════════════════════════════════════════════
//  FUNZIONI PRINCIPALI
// ══════════════════════════════════════════════

// Mescola un array (algoritmo Fisher-Yates)
function mescola(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function mostraSchermata(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function avvia(modalita) {
  modalitaCorrente = modalita;
  indice = 0;
  errori = 0;
  risposte = [];
  inizioTempo = Date.now();

  domandeCorrenti = mescola(domande).slice(0, modalita === 'esame' ? 40 : domande.length);

  // timer solo in modalità esame
  clearInterval(timerID);
  const timerEl = document.getElementById('timer');
  if (modalita === 'esame') {
    secondiRimasti = 1800;
    timerEl.style.display = 'block';
    aggiornaTimer();
    timerID = setInterval(() => {
      secondiRimasti--;
      aggiornaTimer();
      if (secondiRimasti <= 0) fineQuiz('timeout');
    }, 1000);
  } else {
    timerEl.style.display = 'none';
  }

  mostraSchermata('quiz');
  mostraDomanda();
}

function aggiornaTimer() {
  const m = String(Math.floor(secondiRimasti / 60)).padStart(2, '0');
  const s = String(secondiRimasti % 60).padStart(2, '0');
  const el = document.getElementById('timer');
  el.textContent = m + ':' + s;
  el.className = 'timer' + (secondiRimasti < 300 ? ' red' : '');
}

function mostraDomanda() {
  const q = domandeCorrenti[indice];
  const totale = domandeCorrenti.length;

  // aggiorna intestazione
  document.getElementById('num').textContent = indice + 1;
  document.getElementById('tot').textContent = totale;
  document.getElementById('barra').style.width = (indice / totale * 100) + '%';

  // pallini errori (solo esame)
  const erroriEl = document.getElementById('errori');
  erroriEl.innerHTML = modalitaCorrente === 'esame'
    ? '<span style="font-size:.78rem;color:#aaa;margin-right:.3rem">Errori:</span>' +
      [0,1,2].map(i => `<div class="pallino${i < errori ? ' pieno' : ''}"></div>`).join('')
    : '';

  // testo domanda
  document.getElementById('testo-domanda').textContent = q.testo;

  // risposte mescolate
  const lista = document.getElementById('lista-risposte');
  lista.innerHTML = '';
  const ordine = mescola([0, 1, 2]);
  ordine.forEach((origIdx, pos) => {
    const btn = document.createElement('button');
    btn.className = 'risposta';
    btn.textContent = ['A','B','C'][pos] + ') ' + q.risposte[origIdx];
    btn.dataset.orig = origIdx;
    btn.onclick = () => selezionaRisposta(origIdx, btn);
    lista.appendChild(btn);
  });

  // nascondi spiegazione e pulsante
  document.getElementById('spiegazione').className = 'spiegazione';
  document.getElementById('btn-prossima').style.display = 'none';
}

function selezionaRisposta(scelta, btnCliccato) {
  const q = domandeCorrenti[indice];
  const corretta = scelta === q.corretta;

  // disabilita tutti i bottoni e colora
  document.querySelectorAll('.risposta').forEach(btn => {
    btn.disabled = true;
    const orig = parseInt(btn.dataset.orig);
    if (orig === q.corretta) btn.classList.add('corretta');
    else if (btn === btnCliccato && !corretta) btn.classList.add('sbagliata');
  });

  // mostra spiegazione
  const sp = document.getElementById('spiegazione');
  sp.textContent = (corretta ? '✅ ' : '❌ ') + q.spiegazione;
  sp.className = 'spiegazione show';

  // salva risposta
  risposte.push({ indice, scelta, corretta });
  if (!corretta) errori++;

  // aggiorna pallini errori
  document.getElementById('errori').innerHTML = modalitaCorrente === 'esame'
    ? '<span style="font-size:.78rem;color:#aaa;margin-right:.3rem">Errori:</span>' +
      [0,1,2].map(i => `<div class="pallino${i < errori ? ' pieno' : ''}"></div>`).join('')
    : '';

  // fine quiz?
  const ultimalDomanda = indice >= domandeCorrenti.length - 1;
  const troppiErrori = modalitaCorrente === 'esame' && errori >= 3;

  if (troppiErrori) {
    setTimeout(() => fineQuiz('errori'), 1200);
  } else if (ultimalDomanda) {
    setTimeout(() => fineQuiz('completo'), 800);
  } else {
    document.getElementById('btn-prossima').style.display = 'inline-block';
  }
}

function prossima() {
  indice++;
  mostraDomanda();
}

function abbandona() {
  if (confirm('Vuoi abbandonare il quiz?')) {
    clearInterval(timerID);
    mostraSchermata('home');
  }
}

function fineQuiz(motivo) {
  clearInterval(timerID);

  const tempoImpiegato = Math.round((Date.now() - inizioTempo) / 1000);
  const corrette = risposte.filter(r => r.corretta).length;
  const errate = risposte.length - corrette;
  const pct = Math.round(corrette / domandeCorrenti.length * 100);
  const superato = modalitaCorrente === 'esame' ? (errori < 3 && pct >= 90) : pct >= 70;

  // emoji e testo
  const messaggi = {
    timeout: ['⏰', 'Tempo scaduto!', 'Il tempo è terminato.'],
    errori:   ['❌', 'Non superato', 'Hai raggiunto il limite massimo di errori.'],
    completo: superato ? ['🎉', 'Superato!', 'Ottimo risultato!'] : ['😞', 'Non superato', 'Riprova, ci sei quasi!'],
  };
  const [emoji, titolo, sub] = messaggi[motivo] || messaggi.completo;

  document.getElementById('emoji-risultato').textContent = emoji;
  document.getElementById('titolo-risultato').textContent = titolo;
  document.getElementById('punteggio-risultato').textContent = pct + '%';
  document.getElementById('punteggio-risultato').className = 'punteggio ' + (superato ? 'pass' : 'fail');
  document.getElementById('sottotitolo-risultato').textContent = sub;

  // statistiche
  document.getElementById('r-corrette').textContent = corrette;
  document.getElementById('r-errate').textContent = errate;
  const m = String(Math.floor(tempoImpiegato / 60)).padStart(2,'0');
  const s = String(tempoImpiegato % 60).padStart(2,'0');
  document.getElementById('r-tempo').textContent = m + ':' + s;

  // riepilogo domande
  const riepilogo = document.getElementById('riepilogo');
  riepilogo.innerHTML = '<h3 style="margin-bottom:.8rem">Riepilogo risposte</h3>';
  risposte.forEach(r => {
    const q = domandeCorrenti[r.indice];
    const div = document.createElement('div');
    div.className = 'riepilogo-item ' + (r.corretta ? 'ok' : 'no');
    div.innerHTML = `
      <div class="riepilogo-label ${r.corretta ? 'ok' : 'no'}">${r.corretta ? '✓ Corretta' : '✗ Errata'}</div>
      <div>${q.testo}</div>
      ${!r.corretta ? `<div class="corretta-txt">Risposta corretta: ${q.risposte[q.corretta]}</div>` : ''}
    `;
    riepilogo.appendChild(div);
  });

  mostraSchermata('risultati');
}
</script>

</html>
